name: SELF quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/self-personal-management-mvp

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(self): synchronize npm lockfile"
          LOCK_COMMIT="$(git rev-parse HEAD)"
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B lockfile-sync FETCH_HEAD
          git cherry-pick "${LOCK_COMMIT}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: self-package-lock
          path: package-lock.json
          retention-days: 1
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
